  var D = window.OK_I18N || {};
  var LANGS = ['zh-Hant', 'zh-Hans', 'en', 'ja', 'ko', 'es', 'pt', 'hi', 'ms'];
  var NAMES = { 'zh-Hant': '繁體中文', 'zh-Hans': '简体中文', en: 'English', ja: '日本語', ko: '한국어', es: 'Español', pt: 'Português', hi: 'हिन्दी', ms: 'Bahasa Melayu' };
  var SHORT = { 'zh-Hant': '繁中', 'zh-Hans': '简中', en: 'EN', ja: '日本語', ko: '한국어', es: 'ES', pt: 'PT', hi: 'हिं', ms: 'MS' };
  var cur = 'zh-Hant';
  function norm(t) {
    t = String(t || '').toLowerCase();
    if (t.indexOf('zh') === 0) return /hant|-tw|-hk|-mo/.test(t) ? 'zh-Hant' : 'zh-Hans';
    var b = t.split('-')[0];
    if (b === 'id') return 'ms';
    return LANGS.indexOf(b) >= 0 ? b : null;
  }
  function detect() {
    var q = /[?&]lang=([\w-]+)/.exec(location.search);
    if (q) { var n = LANGS.indexOf(q[1]) >= 0 ? q[1] : norm(q[1]); if (n) return n; }
    try {
      var saved = localStorage.getItem('ok-lang') || localStorage.getItem('bk-lang');
      if (LANGS.indexOf(saved) >= 0) return saved;
    } catch (e) {}
    var list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language];
    for (var i = 0; i < list.length; i++) { var l = norm(list[i]); if (l) return l; }
    return 'en';
  }
  function t(key, lang) {
    var v = D[key]; if (!v) return '';
    var s = v[LANGS.indexOf(lang || cur)];
    return s == null || s === '' ? (v[2] || v[0]) : s;   // 缺翻譯時退回英文，再退回繁中
  }
  function fmt(s, vars) { return String(s).replace(/\{(\w+)\}/g, function (m, k) { return vars && k in vars ? vars[k] : m; }); }
  function apply(lang) {
    cur = lang;
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i]').forEach(function (el) {
      var k = el.getAttribute('data-i'), v = t(k);
      if (!v) return;
      if (k.slice(-1) === '!') el.innerHTML = v; else el.textContent = v;
    });
    document.querySelectorAll('[data-ia]').forEach(function (el) {
      el.getAttribute('data-ia').split(';').forEach(function (pair) {
        var p = pair.split(':'); if (p.length === 2 && D[p[1]]) el.setAttribute(p[0].trim(), t(p[1].trim()));
      });
    });
    if (D._title) document.title = t('_title');
    var md = document.querySelector('meta[name="description"]'); if (md && D._desc) md.setAttribute('content', t('_desc'));
    var c = document.getElementById('langCur'); if (c) { c.textContent = SHORT[lang]; }
    var b = document.getElementById('langBtn'); if (b) b.setAttribute('aria-label', 'Language: ' + NAMES[lang]);
    document.querySelectorAll('#langMenu [role="menuitemradio"]').forEach(function (x) { x.setAttribute('aria-checked', String(x.getAttribute('lang') === lang)); });
    document.dispatchEvent(new CustomEvent('ok:lang', { detail: lang }));
  }
  window.OK = { t: t, fmt: fmt, lang: function () { return cur; }, apply: apply, LANGS: LANGS };

  // 語言選單：地球圖示 + 簡稱，點開是各語言的原文名稱
  var btn = document.getElementById('langBtn'), menu = document.getElementById('langMenu'), wrap = document.getElementById('lang');
  if (btn && menu && wrap) {
    LANGS.forEach(function (l) {
      var li = document.createElement('li'); li.setAttribute('role', 'none');
      var x = document.createElement('button');
      x.type = 'button'; x.setAttribute('role', 'menuitemradio'); x.setAttribute('lang', l); x.textContent = NAMES[l];
      x.addEventListener('click', function () {
        try { localStorage.setItem('ok-lang', l); } catch (e) {}
        close(); apply(l); btn.focus();
      });
      li.appendChild(x); menu.appendChild(li);
    });
    var open = function () { menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); var c = menu.querySelector('[aria-checked="true"]') || menu.querySelector('button'); c.focus(); };
    var close = function () { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
    btn.addEventListener('click', function () { if (menu.hidden) open(); else close(); });
    document.addEventListener('click', function (e) { if (!menu.hidden && !wrap.contains(e.target)) close(); });
    menu.addEventListener('keydown', function (e) {
      var items = Array.prototype.slice.call(menu.querySelectorAll('button')), i = items.indexOf(document.activeElement);
      if (e.key === 'Escape') { close(); btn.focus(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    });
  }
  apply(detect());
})();
</script>
</body>
</html>
