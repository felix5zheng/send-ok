/* Hallmark · shape: Index-First product page · genre: editorial · theme: custom (imokahhhh style) · job: try (download a Mac app)

:root {
  color-scheme: light;

  --color-focus: var(--color-ink);
  --nav-glass: oklch(97.2% 0.006 82 / 0.8);
  --ring: 0 0 0 1px oklch(19% 0.024 52 / 0.05);
  --shadow-lift: 0 0 0 1px oklch(19% 0.024 52 / 0.06), 0 14px 30px -18px oklch(19% 0.024 52 / 0.35);
  /* 產品本身的顏色：Mac 螢幕上緣、實體瀏海、App 的系統藍與綠（只在示範畫面裡出現） */
  --screen: oklch(27% 0.012 60);
  --screen-2: oklch(33% 0.012 60);
  --notch: oklch(12% 0.004 60);
  --on-notch: oklch(97% 0.004 80);
  --on-notch-2: oklch(97% 0.004 80 / 0.62);
  --on-notch-track: oklch(97% 0.004 80 / 0.16);
  --sys-blue: oklch(62% 0.2 255);
  --sys-blue-tint: oklch(62% 0.2 255 / 0.18);
  --sys-green: oklch(76% 0.19 148);
  --sys-grey: oklch(42% 0.004 60);
  --doc: oklch(96.5% 0.003 80);
  --doc-fold: oklch(85% 0.004 80);
  --doc-tag: oklch(55% 0.17 285);
  --doc-shadow: 0 4px 8px oklch(12% 0.004 60 / 0.45);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Helvetica Neue", "Noto Sans TC", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang TC", "Helvetica Neue", "Noto Sans TC", Arial, sans-serif;
  --text-xs: 12px; --text-sm: 14px; --text-md: 17px; --text-lg: 21px; --text-xl: 28px; --text-2xl: 40px; --text-display: clamp(44px, 7vw, 72px);
  --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 20px; --space-xl: 28px; --space-2xl: 52px; --space-3xl: 90px;

  --ease: cubic-bezier(0.16, 1, 0.3, 1); --spring: cubic-bezier(0.34, 1.22, 0.64, 1); --dur: 240ms; --dur-long: 480ms;
  --container: 1200px; --gutter: 40px; --bar-h: 52px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 72px; }
body { margin: 0; background: var(--color-paper); color: var(--color-ink-2); font-family: var(--font); font-size: var(--text-md); line-height: 1.47; letter-spacing: -0.016em; -webkit-font-smoothing: antialiased; touch-action: manipulation; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); color: var(--color-ink); font-weight: 600; overflow-wrap: break-word; min-width: 0; text-wrap: balance; }
p { margin: 0; text-wrap: pretty; }
a { color: inherit; }

/* 導覽列 */
.bar { position: sticky; top: 0; z-index: 30; background: var(--nav-glass); -webkit-backdrop-filter: saturate(160%) blur(20px); backdrop-filter: saturate(160%) blur(20px); box-shadow: 0 1px 0 var(--color-hairline); }

.nav a[aria-current="page"] { color: var(--color-ink); }

/* 膠囊按鈕：1px ink 外框，滑上去變 ink 底 */
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 var(--space-lg); border-radius: var(--radius-pill); border: 1px solid var(--color-ink); color: var(--color-ink); background: transparent; font: inherit; font-size: var(--text-sm); text-decoration: none; cursor: pointer;
  transition: background-color var(--dur) var(--ease), color var(--dur) var(--ease); }

.link:hover { text-decoration-color: var(--color-ink); }

/* 頁尾 */

.foot .container { display: flex; flex-wrap: wrap; gap: var(--space-sm) var(--space-xl); padding-block: var(--space-lg) var(--space-xl); font-size: var(--text-xs); color: var(--color-muted); }

.doc li:last-child { margin-bottom: 0; }

.doc a:not(.btn) { color: var(--color-ink); text-decoration-color: var(--color-hairline); text-underline-offset: 0.25em; border-radius: 3px; }

.doc dl { margin: 0; display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 0 var(--space-lg); }
